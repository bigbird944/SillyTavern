project:
  name: 全能工匠
  worldbookName: 全能工匠
  form: charactercard
  mvu: true
  avatar: null

world:
  overview: |
    现实地球背景。主角{{user}}绑定"全能工匠"系统，系统对外完全隐秘无法被任何方式发现。
    系统能力：提供无限制的知识、无上限的动手能力（手工、编程、音乐、厨艺等一切创造能力）。
    系统限制：不提供直接兑换成品、不能给他人灌输知识、不能直接强化主角身体（主角可自己修炼但系统不直接赋予）。
    玩法核心：主角潜力无限，但受限于材料和时间，鼓励通过创造性产物解决问题或享受自由创作。
    扩展可能：玩家可能探索宇宙、异世界等方向。
  regions: []  # 不预设区域，由玩家创造
  factions: []  # 主角独一无二，暂不设定势力

characters: []  # 暂不设定角色，人物不是核心

style:
  perspective: 第三人称
  tone: 轻松、口语化
  mood: 自由、探索
  reference: null  # 待细化

entries:
  - name: 世界设定
    type: 世界观
    path: 世界书/世界观/世界设定.yaml
    purpose: 现实地球背景 + 全能工匠系统核心规则
  
  - name: 扮演准则
    type: 扮演准则
    path: 世界书/扮演准则/扮演准则.yaml
    purpose: AI如何响应玩家创造、多领域玩法支持、世界反馈原则、叙事方式

  - name: 变量列表
    type: MVU
    path: 世界书/MVU/变量列表.yaml
    part: variable_list

  - name: 更新规则
    type: MVU
    path: 世界书/MVU/更新规则.yaml
    part: update_rules

  - name: 输出格式
    type: MVU
    path: 世界书/MVU/输出格式.yaml
    part: output_format

  - name: 初始变量
    type: MVU
    path: 世界书/MVU/初始变量.yaml
    part: initvar

mvu:
  structure: |
    顶层结构：
    ├── 时空信息
    │   ├── 当前时间
    │   ├── 当前日期
    │   ├── 当前位置（地球/宇宙/异世界）
    │   └── 已开启的空间通道
    ├── 主角状态
    │   ├── 体力
    │   ├── 精神状态
    │   ├── 身体改造记录（种族变异、强化、修行进度）
    │   ├── 装备道具
    │   └── 技能能力
    ├── 创作项目
    │   ├── 进行中的项目列表
    │   └── 项目详情（名称、类型、进度、材料需求、预计时间）
    ├── 资产库存
    │   ├── 资金（现金、虚拟货币）
    │   ├── 材料库存
    │   ├── 成品仓库
    │   └── 载具据点列表（名称、位置、功能、状态）
    ├── 商业版图
    │   ├── 经营实体（公司、店铺、工作室）
    │   ├── 销售渠道
    │   └── 收入来源
    ├── 网络影响
    │   ├── 社交媒体账号（直播、UP主、论坛）
    │   ├── 粉丝数关注度
    │   └── 代表作品
    ├── 世界影响
    │   ├── 创作物引发的世界变化
    │   ├── 社会声望身份
    │   └── 重大事件记录
    ├── 势力关系
    │   ├── 建立的组织势力
    │   ├── 成员下属
    │   └── 与其他势力的关系
    └── 社交网络
        ├── 认识的人物
        ├── 关系状态
        └── 合作敌对关系
  
  variables:  # 待细化：创作阶段补充具体变量定义

ejs: null  # 不使用 EJS

first_message:
  format: 叙事式  # 待细化
  word_count: 300~500  # 待细化
  scene: null  # 待细化：创作阶段确定开场情境
  opening_situation: null  # 待细化
